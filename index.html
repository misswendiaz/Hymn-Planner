<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hymn Planner</title>

    <meta
      name="description"
      content="Hymn Planner is a web application that simplifies hymn selection and sacrament meeting planning through a searchable hymn library, topic-based recommendations filtering tools, and saved meeting plans, helping leaders and musicians prepare more efficiently."
    />
    <meta name="author" content="Laureen Diaz" />
    <meta
      name="keywords"
      content="hymn planner, LDS hymns, sacrament hymns, hymn selection"
    />

    <!-- Open Graph (Facebook, Messenger, Discord, etc.) -->
    <meta property="og:title" content="Hymn Planner" />
    <meta
      property="og:description"
      content="Search, organize, and plan hymns for sacrament meetings."
    />
    <!-- <meta property="og:image" content="assets/preview.png">

    <meta property="og:url" content="https://yourusername.github.io/hymn-planner/"> -->

    <link rel="stylesheet" href="/src/css/stylesheet.css" />

    <script type="module" src="/src/js/main.js"></script>
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <div>
        <!-- Logo -->
        <img src="/src/public/images/logo.svg" alt="Hymn Planner Logo" />

        <!-- Website Name -->
        <h1>Hymn Planner</h1>
      </div>

      <!-- Navigation -->
      <nav>
        <ul>
          <li><a href="#" data-page="generator">Generator</a></li>
          <li><a href="#" data-page="library">Library</a></li>
          <li><a href="#" data-page="plans">Plans</a></li>
        </ul>
      </nav>

    <!-- FOOTER -->
    <footer>
      <div>
        <p>© 2026</p>
        <p>Hymn Planner</p>
      </div>
    </footer>
  </body>
</html>
